<head>
  <meta charset="UTF-8"> <!-- Tells the browser which character set to use. -->
  <title>Add Patient</title> <!-- Sets the tab title shown in the browser. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='add_patient.css') }}"> <!-- Links this page to the CSS file in the static folder. -->
</head>
<body>
<h1>Add Patient</h1>

{% if not success %}
<form method="POST">
  <div class="form-grid">
    {% for column in columns %}
      <div class="field">
        <label>{{ column }}</label>
        <input name="{{ column }}">
      </div>
    {% endfor %}
  </div>
  <button type="submit">Add Patient</button>
</form>
{% endif %}

{% if success %}
    <p>{{ success }}</p>
{% endif %}

<a href="/menu">Home</a>

</body>
