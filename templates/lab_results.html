<head>
  <meta charset="UTF-8"> <!-- Tells the browser which character set to use. -->
  <title>Lab Results Viewer</title> <!-- Sets the tab title shown in the browser. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='lab_results.css') }}"> <!-- Links this page to the CSS file in the static folder. -->
</head>

<h1>Lab Results Viewer</h1>
<body>
    <div class="input-container">
    <form method="POST">
        <p>
        <label>FIRST:</label>  <input name="FIRST">
        <label>LAST:</label>   <input name="LAST">
        <label>DOCTOR:</label>  <input name="DOCTOR_LAST">
        <select name="TYPE" class="dropdown">
            <option value="">--Select Test Type--</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Cardiac">Cardiac</option>
            <option value="CBC">CBC</option>
            <option value="Microbiology">Microbiology</option>
            <option value="Thyroid">Thyroid</option>
            <option value="Urinalysis">Urinalysis</option>
        </select>
       
        <button type="submit">Search</button>
         </p>
    </form>
    </div>
    <table class="lab-table">
    <thead>
        <tr>
            {% for label, value in results[0].items() %}
                <th>{{ label }}</th>
            {% endfor %}
        </tr>
    </thead>

    <tbody>
        {% for item in results %}
        <tr>
            {% for label, value in item.items() %}
                <td>{{ value }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
